<!-- layout: none -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ישוע בלוג - דף לא נמצא</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        color: #211E19;
        font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(1100px 520px at 85% -8%, rgba(28, 94, 82, 0.08), transparent 60%),
          radial-gradient(900px 460px at 10% 0%, rgba(201, 146, 46, 0.08), transparent 55%),
          #FAF8F3;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        padding: 0.45rem 1.2rem;
        border-radius: 999px;
        border: 1px solid #E8E3D8;
        background: #fff;
        color: #B0812B;
        box-shadow: 0 1px 2px rgba(33,30,25,0.05);
        margin-bottom: 1.5rem;
      }
      .kicker::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #DDB35B; }
      h1 {
        font-family: 'Frank Ruhl Libre', Georgia, serif;
        font-size: clamp(3.5rem, 10vw, 5.5rem);
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 0.75rem;
      }
      .code {
        display: block;
        font-family: 'Frank Ruhl Libre', Georgia, serif;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.35em;
        color: #B0812B;
        margin-bottom: 1.5rem;
      }
      p.msg {
        max-width: 420px;
        color: #6E675C;
        line-height: 1.8;
        margin-bottom: 2.25rem;
      }
      a.home {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        color: #FDFCF9;
        background: linear-gradient(135deg, #1C5E52, #14473E);
        padding: 0.85rem 2.2rem;
        border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 12px 34px -10px rgba(28, 94, 82, 0.35);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      a.home:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 40px -10px rgba(28, 94, 82, 0.5);
      }
      a.home span { transition: transform 0.3s ease; }
      a.home:hover span { transform: translateX(-4px); }
      .note { margin-top: 2.5rem; font-size: 0.8rem; color: #A29A8C; }
    </style>
  </head>
  <body>
    <span class="kicker">רגע של שקט</span>
    <h1>הדרך הפנה לכיוון אחר</h1>
    <span class="code">404</span>
    <p class="msg">
      הדף שחיפשת לא נמצא כאן. אולי הוא הועבר, אולי מעולם לא היה.
      בכל מקרה - הפוסטים האחרונים ממתינים לך בדף הבית.
    </p>
    <a href="/" class="home"><span>←</span> חזרה לדף הבית</a>
    <p class="note">ישוע בלוג · יומן מסע על החיפוש אחר אמת</p>
  </body>
</html>

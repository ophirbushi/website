<!-- layout: none -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ישוע בלוג - דף לא נמצא</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #152B25;
            color: #F3EEE1;
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(58% 46% at 50% -4%, rgba(211, 169, 78, 0.16) 0%, transparent 70%),
                radial-gradient(38% 32% at 84% 16%, rgba(39, 73, 63, 0.75) 0%, transparent 70%);
        }

        .wrap {
            position: relative;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 520px;
        }

        .code {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: clamp(5rem, 16vw, 8.5rem);
            font-weight: 900;
            line-height: 1;
            color: #D3A94E;
            letter-spacing: 0.02em;
        }

        .code::after {
            content: '';
            display: block;
            width: 72px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, #D3A94E, transparent);
            margin: 1.2rem auto 0;
        }

        h1 {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin: 1.8rem 0 0.8rem;
        }

        p {
            color: rgba(243, 238, 225, 0.72);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-block;
            padding: 0.8rem 2rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .links a.primary {
            background: #B98A2F;
            color: #201808;
        }

        .links a.primary:hover {
            background: #D3A94E;
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(211, 169, 78, 0.3);
        }

        .links a.ghost {
            border: 1px solid rgba(243, 238, 225, 0.2);
            color: #F3EEE1;
        }

        .links a.ghost:hover {
            background: rgba(243, 238, 225, 0.08);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>נראה שהדף נעלם</h1>
        <p>עמוד זה אינו קיים או שהועבר. אולי יפה יותר ללכת פשוט אחורה — לבית, או להמשיך בקריאה.</p>
        <div class="links">
            <a href="/" class="primary">חזרה לדף הבית</a>
            <a href="/blog.html" class="ghost">לקריאת הפוסטים</a>
        </div>
    </div>
</body>
</html>
